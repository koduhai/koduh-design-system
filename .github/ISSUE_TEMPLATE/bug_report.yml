name: Bug report
description: Report a problem with a component or the library
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug. Please fill out the fields below.
  - type: checkboxes
    id: search
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and this has not been reported.
          required: true
  - type: input
    id: component
    attributes:
      label: Component
      description: Which component or API is affected (e.g. Select, DataTable, useToast)?
      placeholder: Select
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: The version of @koduhai/design-system you are running.
      placeholder: 2.12.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce, or a link to a minimal reproduction (StackBlitz, CodeSandbox, or a repo).
      placeholder: |
        1. Render <Select ... />
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / OS
      description: Browser and version, OS, and React version.
      placeholder: Chrome 124 on Windows 11, React 19
    validations:
      required: false
