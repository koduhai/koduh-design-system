name: Feature request
description: Suggest a new component, prop, or improvement
labels: [enhancement]
body:
  - type: checkboxes
    id: search
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and this has not already been requested.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do, and what is missing or hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or solution
      description: Sketch the component, prop, or behavior you have in mind (a code sample helps).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you tried or considered, and why they fall short.
    validations:
      required: false
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility considerations
      description: Keyboard interaction, ARIA roles/states, focus management, or contrast notes. WCAG AA is a hard requirement here.
    validations:
      required: false
