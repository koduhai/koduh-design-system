# CI: runs quality gates (typecheck, lint, unit tests, build, e2e) on PRs to main and pushes to main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    # Pinned (not ubuntu-latest) so the runner image can't drift and re-break the
    # committed Linux visual baselines, which are generated against this same image.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E a11y tests (axe, both themes)
        run: npm run test:e2e -- --grep axe

      # Visual regression against the committed Linux baselines
      # (e2e/components.spec.ts-snapshots/*-linux.png). The ubuntu runner and the
      # playwright:*-jammy image used to generate the baselines share the same
      # Chromium + glibc, so rendering matches; playwright.config.ts allows a
      # small maxDiffPixelRatio for sub-pixel anti-aliasing differences.
      - name: E2E visual regression
        run: npm run test:e2e -- --grep visual

      - name: Upload Playwright report + diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
