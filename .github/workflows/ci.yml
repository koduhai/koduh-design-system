# CI: runs quality gates (typecheck, lint, unit tests, build, e2e) on PRs to main and pushes to main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    # Pinned (not ubuntu-latest) so the runner image can't drift and re-break the
    # committed Linux visual baselines, which are generated against this same image.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Catch tree-shaking / sideEffects regressions on the PR rather than only
      # at release (release.yml runs this too).
      - name: Verify bundle (tree-shaking / sideEffects)
        run: npm run verify:bundle

      # Guard against release/docs drift: the built export surface must match
      # src/index.ts, and CLAUDE.md's component count must be accurate (issue #6).
      - name: Verify export surface + docs
        run: npm run verify:exports

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox

      # Run the FULL e2e suite: axe a11y (both themes), visual regression against
      # the committed Linux baselines (e2e/components.spec.ts-snapshots/*-linux.png;
      # the ubuntu runner matches the baseline image's Chromium + glibc), AND any
      # untitled interaction tests. This used to be split into `--grep axe` and
      # `--grep visual` steps, which silently skipped any test whose title matched
      # neither (e.g. the #34 overlay-anchoring test), so those never ran.
      - name: E2E tests (axe + visual + interaction, both themes)
        run: npm run test:e2e

      - name: Upload Playwright report + diffs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
