# CI: runs quality gates (typecheck, lint, unit tests, build, e2e) on PRs to main and pushes to main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Runs only the axe a11y e2e tests — these are deterministic and platform
      # independent. Visual-snapshot tests are excluded until baseline images are
      # generated on this CI platform and committed (see task: visual regression).
      - name: E2E a11y tests
        run: npm run test:e2e -- --grep axe
