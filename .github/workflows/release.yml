# Publishes the package to the public npm registry when a GitHub Release is
# published. Trigger: create a Release in the GitHub UI (tag like v1.0.0). This
# builds, runs the gates, and publishes; the maintainer controls the trigger.
#
# Auth uses npm trusted publishing (OIDC): no NPM_TOKEN secret. npm exchanges the
# GitHub Actions OIDC token for a short-lived registry credential, so the publish
# only works from this exact repo + workflow. Requirements: a trusted publisher
# configured for the package on npmjs.com (Settings -> the package -> Publishing
# access -> add this repo and workflow file), npm >= 11.5.1 (installed below),
# and the id-token: write permission.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC) and automatic build provenance.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    # Never publish from a pre-release (e.g. v1.2.0-rc.1). Only a final release
    # should push a public version to the registry.
    if: ${{ github.event.release.prerelease == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >= 11.5.1; the npm bundled with
      # Node 20 is older, so upgrade it before publishing.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      # Guard: the published artifact is whatever package.json says, so the
      # release tag (vX.Y.Z) must match package.json's version exactly. Without
      # this, tagging vN while package.json still holds an older/newer version
      # would publish the wrong version under the wrong tag.
      - name: Verify tag matches package.json version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "Tag $TAG matches package.json ($PKG)."

      - name: Install dependencies
        run: npm ci

      - name: Verify gates
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run verify:bundle
          npm run verify:exports

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox

      # Run the FULL e2e suite: axe a11y (both themes), visual regression against
      # the committed Linux baselines (e2e/components.spec.ts-snapshots/*-linux.png;
      # the ubuntu runner matches the baseline image's Chromium + glibc), AND any
      # untitled interaction tests. This used to be split into `--grep axe` and
      # `--grep visual` steps, which silently skipped any test whose title matched
      # neither (e.g. the #34 overlay-anchoring test), so those never ran.
      - name: E2E tests (axe + visual + interaction, both themes)
        run: npm run test:e2e

      - name: Upload Playwright report + diffs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish to npm
        # Trusted publishing: npm authenticates via the OIDC token (no
        # NODE_AUTH_TOKEN). --access public is required for the first publish of a
        # scoped package (@koduhai/*); build provenance is attached automatically
        # under trusted publishing.
        run: npm publish --access public
