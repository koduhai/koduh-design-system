# Publishes the package to GitHub Packages when a GitHub Release is published.
# Trigger: create a Release in the GitHub UI (tag like v1.0.0). This builds,
# runs the gates, and publishes — the maintainer controls the trigger.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    # Never publish from a pre-release (e.g. v1.2.0-rc.1). Only a final release
    # should push a public version to the registry.
    if: ${{ github.event.release.prerelease == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com

      # Guard: the published artifact is whatever package.json says, so the
      # release tag (vX.Y.Z) must match package.json's version exactly. Without
      # this, tagging vN while package.json still holds an older/newer version
      # would publish the wrong version under the wrong tag.
      - name: Verify tag matches package.json version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "Tag $TAG matches package.json ($PKG)."

      - name: Install dependencies
        run: npm ci

      - name: Verify gates
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run verify:bundle
          npm run verify:exports

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Run the FULL e2e suite: axe a11y (both themes), visual regression against
      # the committed Linux baselines (e2e/components.spec.ts-snapshots/*-linux.png;
      # the ubuntu runner matches the baseline image's Chromium + glibc), AND any
      # untitled interaction tests. This used to be split into `--grep axe` and
      # `--grep visual` steps, which silently skipped any test whose title matched
      # neither (e.g. the #34 overlay-anchoring test), so those never ran.
      - name: E2E tests (axe + visual + interaction, both themes)
        run: npm run test:e2e

      - name: Upload Playwright report + diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish to GitHub Packages
        run: npm publish
        # GITHUB_TOKEN often can't create a *new* package under a personal-account
        # namespace (E403 permission_denied: write_package). Set an NPM_TOKEN repo
        # secret — a classic PAT with write:packages — to publish; falls back to
        # GITHUB_TOKEN (works once the package exists / for org-owned repos).
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
