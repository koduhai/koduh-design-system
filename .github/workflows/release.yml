# Publishes the package to GitHub Packages when a GitHub Release is published.
# Trigger: create a Release in the GitHub UI (tag like v1.0.0). This builds,
# runs the gates, and publishes — the maintainer controls the trigger.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci

      - name: Verify gates
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run verify:bundle
          npm run verify:exports

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E a11y tests (axe, both themes)
        run: npm run test:e2e -- --grep axe

      # Visual regression against the committed Linux baselines
      # (e2e/components.spec.ts-snapshots/*-linux.png). The ubuntu runner and the
      # playwright:*-jammy image used to generate the baselines share the same
      # Chromium + glibc, so rendering matches; playwright.config.ts allows a
      # small maxDiffPixelRatio for sub-pixel anti-aliasing differences.
      - name: E2E visual regression
        run: npm run test:e2e -- --grep visual

      - name: Upload Playwright report + diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish to GitHub Packages
        run: npm publish
        # GITHUB_TOKEN often can't create a *new* package under a personal-account
        # namespace (E403 permission_denied: write_package). Set an NPM_TOKEN repo
        # secret — a classic PAT with write:packages — to publish; falls back to
        # GITHUB_TOKEN (works once the package exists / for org-owned repos).
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
