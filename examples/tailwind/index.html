<!doctype html>
<!-- Start in light mode: Tailwind's class strategy treats absence of `.dark` as
     light, but the design system's `:root` is dark by default, so we set
     `.light` explicitly here. The toggle in App.tsx flips between `.dark`/`.light`. -->
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@koduhai/design-system + Tailwind</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
